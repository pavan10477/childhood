<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f7">
  <title>Reset password | GrowWell</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page auth-login-page">
  <main class="auth-simple-card">
    <a class="auth-brand" href="{{ url_for('login') }}" aria-label="GrowWell sign in">
      <span class="auth-brand-mark" aria-hidden="true">+</span>
      <span><strong>GrowWell</strong><small>CHILD GROWTH SCREENING</small></span>
    </a>
    <div class="auth-card-icon" aria-hidden="true">⌑</div>
    <div class="eyebrow">ACCOUNT RECOVERY</div>
    <h1>Choose a new password</h1>
    <p class="auth-intro">Create a new password with at least 8 characters.</p>
    {% if error %}
      <div class="auth-message error" role="alert">{{ error }}</div>
    {% endif %}
    <form class="login-form auth-login-form" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">New password
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      </label>
      <label for="confirm-password">Confirm new password
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required>
      </label>
      <button type="submit">Update password <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('login') }}">← Back to sign in</a></p>
    <p class="auth-privacy"><span aria-hidden="true">⌑</span> Reset links expire after 30 minutes and can only be used once.</p>
  </main>
</body>
</html>
